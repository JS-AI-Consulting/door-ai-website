<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | Door AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Public+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #eef1ef; --ink: #142429; --muted: #4b5f64; --cherry: #a62639; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f191c; --ink: #e6eeec; --muted: #9fb2b4; --cherry: #e0606f; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.6 "Public Sans", system-ui, sans-serif; padding-inline: 16px; }
main { max-width: 32em; display: grid; gap: 18px; }
h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 2.6rem; line-height: 1.1; margin: 0; }
p { margin: 0; color: var(--muted); }
a { color: var(--cherry); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Thanks, we got your request.</h1>
  <p>Joe or Sam will be in touch within one business day to set up your free Business Check-Up.</p>
  <p><a href="/">Back to the home page</a></p>
